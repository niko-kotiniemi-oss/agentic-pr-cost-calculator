name: Bug report
description: Something the tool does differently from its documentation
labels: [bug]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: This repository is public, and an issue cannot be made private later.
      options:
        - label: This issue holds no transcript, session identifier, token, private name or usage figure from private work.
          required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Name the feature page or requirement in docs/ that says what should happen, if you can.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        Give a synthetic transcript line, made from the template line below with
        every identifier and path invented, or the counts that the comment shows.
        Never paste a real transcript, or a line of one: it holds what was said in
        the session, and an issue here is public.
      value: |
        {"type": "<assistant>", "sessionId": "<an invented id>", "cwd": "<an invented path>", "gitBranch": "<an invented branch>", "timestamp": "<a time>", "message": {"model": "<a model's name>", "usage": {"input_tokens": "<a count>", "output_tokens": "<a count>", "cache_read_input_tokens": "<a count>"}}}
  - type: textarea
    id: versions
    attributes:
      label: Versions
      value: |
        - Calculator version or commit:
        - Python version:
        - Claude Code version:
        - git version:
