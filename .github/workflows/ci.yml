name: CI

on:
  pull_request:
    # GitHub's default three, and `edited`, which a change of the pull request's
    # base branch is, so that the tests compare with the new base. `edited` also
    # runs them again when the title or the description changes, a cost that
    # T70 accepts.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# No `paths:` filters: a required check that never runs never reports, and the
# pull request then waits forever.

defaults:
  run:
    # GitHub's own shell for `bash`, with pipefail, which its default lacks, so
    # that `check | head` fails where the check fails, run through a filter that
    # writes what each command prints in printable ASCII, so that a check which
    # quotes a planted path as it is writes no hidden character into the log
    # (R278). The filter reads until each process that holds its pipe ends, so a
    # step that starts a process in the background sends that process's output
    # elsewhere, or waits for it. One step of the job `ci` runs outside it, to
    # check it.
    shell: python3 -I scripts/printable_log.py bash --noprofile --norc -eo pipefail {0}

# Declared rather than inherited, so what these jobs can do is readable here.
# Nothing in this workflow writes, comments or reads a secret.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the tool supports, and the newest release. The
        # oldest rises only when it nears its end of life, or when a security fix
        # needs a newer one (DR-134).
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, so that the tests can compare the decision
          # records with the commit named below.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
        env:
          # What the default branch held before this change: the pull request's
          # base commit, or the commit that a push to the default branch replaced.
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: scripts/verify-openspec.sh

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/sync-superpowers.sh --check

  # Every check above, on this repository's own files, but its scripts, saved
  # with a carriage return before each line feed and left unstaged, as an
  # editor on Windows can save them, so that a check which reads a file of the
  # working tree otherwise than git stages it fails here. The step that saves
  # them fails where it saved none (R276).
  windows-line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/windows_line_endings.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: scripts/verify-openspec.sh
      - run: scripts/sync-superpowers.sh --check

  # The one check a ruleset needs to require: it passes only when every job
  # above passed. GitHub skips a job whose needed job failed, and reports it as
  # passing, unless its `if` uses a status function, so it runs `always()`, and
  # its last step reads what each job gave (R276).
  ci:
    if: always()
    needs: [python, openspec, vendor, windows-line-endings]
    runs-on: ubuntu-latest
    steps:
      # The shell's filter is a file of the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The one step that runs outside the filter, under GitHub's own shell for
      # bash: it fails where the filter loses a command's exit status, or the
      # signal that stopped it, which would let every other step, and this job,
      # pass whatever their commands did. It writes nothing of the filter's to
      # the log (R278).
      - shell: bash
        run: |
          status=0
          python3 -I scripts/printable_log.py bash -c 'exit 3' > /dev/null 2>&1 || status=$?
          echo "The filter gave $status for a command that exits with 3."
          [ "$status" -eq 3 ]
          status=0
          python3 -I scripts/printable_log.py bash -c 'kill -TERM $$' > /dev/null 2>&1 || status=$?
          echo "The filter gave $status for a command that SIGTERM stops."
          [ "$status" -eq 143 ]
      - run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          python3 -I -c '
          import json, sys
          sys.exit(any(result != "success" for result in json.loads(sys.argv[1])))
          ' "$results"
