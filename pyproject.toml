[project]
name = "agentic-pr-cost-calculator"
version = "0.0.0"
description = "Estimate what an agentic coding pull request cost in model tokens and CI minutes."
license = "LicenseRef-FCL-1.0-MIT"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# The vendored copy is upstream's and is never edited here. It alone is left out, not
# every folder named `vendor`, and a test runs the naming rules on every file that this
# repository writes, whatever this file leaves out (R271).
extend-exclude = ["vendor/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["tests", "scripts", "skeleton"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The wording test and the rewording script read the pages with the same module.
pythonpath = ["scripts", "skeleton"]
